plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.personalfinance'
    compileSdk 35

    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'FIREBASE_API_KEY', ' " ' + providers.gradleProperty('firebaseApiKey').getOrElse('') + '"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + providers.gradleProperty('firebaseProjectId').getOrElse('') + '"'

        applicationId "com.example.personalfinance"
        minSdk 24
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packaging {
        resources {
            excludes += ['META-INF/NOTICE*', 'META-INF/LICENSE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
     
    implementation 'androidx.work:work-runtime:2.9.1'
}
